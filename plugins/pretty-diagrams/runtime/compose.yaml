services:
  excalidraw:
    build: .
    image: gm2211/pretty-diagrams:0.1.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - checkpoints:/tmp/excalidraw-mcp-checkpoints
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  checkpoints:
